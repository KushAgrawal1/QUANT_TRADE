[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Real-bug rules only: pyflakes (unused/undefined names) and syntax errors.
# Style rules are off on purpose - the code uses aligned assignments.
select = ["F", "E9"]
